kind = "web"
previewPath = "/"
title = "Atko Bros Landscaping"
version = "1.0.0"
id = "artifacts/atko-bros"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23869
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/atko-bros run dev"

[services.env]
PORT = "23869"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/atko-bros", "run", "build"]
publicDir = "artifacts/atko-bros/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
